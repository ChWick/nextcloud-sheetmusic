services:
  nextcloud:
    image: nextcloud:stable-apache
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html/custom_apps/mobilesheetsmanager
      - ./nextcloud/config:/var/www/html/config
      - ./nextcloud/data:/var/www/html/data
      - ./init-dev-flags.sh:/docker-entrypoint-hooks.d/before-starting/init-dev-flags.sh:ro
      # PHP changes (routes, controllers, mappers) take effect without a restart.
      - ./opcache-dev.ini:/usr/local/etc/php/conf.d/zz-dev-opcache.ini:ro
    environment:
      - SQLITE_DATABASE=nextcloud_dev_db
      # - NEXTCLOUD_ADMIN_USER=admin
      # - NEXTCLOUD_ADMIN_PASSWORD=admin
        
  code-server:
    image: linuxserver/code-server:latest
    restart: always
    ports:
      - "8443:8443"
    volumes:
      - code_server_config:/config
      - ..:/config/workspace/mobilesheetsmanager
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD=admin
      - DEFAULT_WORKSPACE=/config/workspace/mobilesheetsmanager
      - NODEJS_MOD_VERSION=26
      - DOCKER_MODS=linuxserver/mods:code-server-nodejs|linuxserver/mods:code-server-pnpm

volumes:
  code_server_config: