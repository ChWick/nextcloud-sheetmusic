; Development helper: make the container pick up changed PHP files immediately.
;
; Nextcloud's PHP runs with OPcache, and this image validates changed files only rarely, so
; a new API route (appinfo/routes.php) or a changed controller keeps being invisible until
; the container is restarted. That shows up in the app as an unexpected HTTP 404/405.
;
; Mounted read-only through .docker/docker-compose.yml.
opcache.validate_timestamps=1
opcache.revalidate_freq=0